<!doctype html>
<html>
  <head>
    <meta charset="utf8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <style>
      :root {
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        padding: 0;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #fff;
        color: #000;
      }
      img {
        max-width: 100%;
      }
      [hidden]:not([hidden="until-found" i]) {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <title>Cyber Security and Privacy</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Bricolage+Grotesque:wght@600;700&display=swap"
    />
    <style>
      /* Layout: single-column study tool. Home lists topics and exam modes; quiz is one card at a time; answer sheet is a searchable accordion. */
      :root {
        --bg: #f2f5f7;
        --surface: #ffffff;
        --fg: #13202b;
        --muted: #5a6b78;
        --line: #d6dee4;
        --accent: #0a6b73;
        --accent-fg: #ffffff;
        --accent-soft: #dff0f1;
        --good: #17703a;
        --good-soft: #e1f3e8;
        --bad: #b3261e;
        --bad-soft: #fbe5e3;
        --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
        --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0f171d;
          --surface: #17222b;
          --fg: #e6edf2;
          --muted: #93a4b1;
          --line: #2a3945;
          --accent: #4fc1c9;
          --accent-fg: #06262a;
          --accent-soft: #12343a;
          --good: #5fcf8a;
          --good-soft: #143323;
          --bad: #ff8c84;
          --bad-soft: #3b1a18;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0f171d;
        --surface: #17222b;
        --fg: #e6edf2;
        --muted: #93a4b1;
        --line: #2a3945;
        --accent: #4fc1c9;
        --accent-fg: #06262a;
        --accent-soft: #12343a;
        --good: #5fcf8a;
        --good-soft: #143323;
        --bad: #ff8c84;
        --bad-soft: #3b1a18;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 var(--body);
        padding-block: 20px 48px;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      h1,
      h2,
      h3 {
        font-family: var(--display);
        margin: 0;
        text-wrap: balance;
        line-height: 1.15;
      }
      h1 {
        font-size: clamp(1.7rem, 5vw, 2.3rem);
      }
      h2 {
        font-size: 1.25rem;
      }
      .sub {
        color: var(--muted);
        margin: 6px 0 0;
      }
      .mono {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      summary:focus-visible,
      input:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      .btn {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 8px;
        padding: 10px 14px;
        font-weight: 500;
      }
      .btn:hover {
        border-color: var(--accent);
      }
      .btn.primary {
        background: var(--accent);
        color: var(--accent-fg);
        border-color: var(--accent);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .modes {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 10px;
      }
      .mode {
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 14px;
      }
      .mode b {
        font-family: var(--display);
        font-size: 1.05rem;
      }
      .mode span {
        color: var(--muted);
        font-size: 0.88rem;
      }
      .mode.primary span {
        color: inherit;
        opacity: 0.85;
      }
      .topics {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        overflow: hidden;
      }
      .topic {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 12px;
        text-align: left;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: none;
        padding: 12px 14px;
        align-items: center;
      }
      .topic:last-child {
        border-bottom: 0;
      }
      .topic:hover {
        background: var(--accent-soft);
      }
      .topic .t {
        font-weight: 500;
        min-width: 0;
      }
      .topic .n {
        color: var(--muted);
        font-size: 0.85rem;
        text-align: right;
      }
      .topic .best {
        grid-column: 1/-1;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .bar {
        height: 6px;
        background: var(--line);
        border-radius: 3px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--accent);
        width: 0;
        transition: width 0.2s;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .meta {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font-size: 0.85rem;
        flex-wrap: wrap;
      }
      .q {
        font-size: 1.1rem;
        font-weight: 500;
        line-height: 1.45;
        margin: 0;
      }
      .opts {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .opt {
        display: grid;
        grid-template-columns: 28px 1fr;
        gap: 10px;
        text-align: left;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        align-items: start;
      }
      .opt:hover:not(:disabled) {
        border-color: var(--accent);
      }
      .opt .k {
        font-family: var(--mono);
        color: var(--muted);
        font-size: 0.85rem;
        padding-top: 2px;
      }
      .opt.picked {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .opt.good {
        border-color: var(--good);
        background: var(--good-soft);
      }
      .opt.bad {
        border-color: var(--bad);
        background: var(--bad-soft);
      }
      .opt:disabled {
        cursor: default;
      }
      .explain {
        border-left: 3px solid var(--accent);
        padding: 8px 12px;
        background: var(--accent-soft);
        border-radius: 0 8px 8px 0;
        font-size: 0.95rem;
      }
      .verdict {
        font-weight: 600;
      }
      .verdict.good {
        color: var(--good);
      }
      .verdict.bad {
        color: var(--bad);
      }
      .score {
        font-family: var(--display);
        font-size: 3rem;
        line-height: 1;
      }
      .wrong {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .wrong .item {
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }
      .ans {
        color: var(--good);
        font-weight: 500;
      }
      .mine {
        color: var(--bad);
      }
      input[type="search"] {
        width: 100%;
        font: inherit;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--fg);
      }
      details {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
      }
      summary {
        cursor: pointer;
        padding: 12px 14px;
        font-weight: 500;
        list-style: none;
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      .sheet {
        padding: 0 14px 8px;
      }
      .sheet .item {
        border-top: 1px solid var(--line);
        padding: 12px 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .sheet .item p {
        margin: 0;
      }
      .sheet .opts-list {
        margin: 0;
        padding-left: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: 0.95rem;
      }
      .sheet .opts-list li.c {
        color: var(--good);
        font-weight: 600;
      }
      .sheet .why {
        color: var(--muted);
        font-size: 0.9rem;
      }
      .back {
        align-self: flex-start;
      }
      .note {
        color: var(--muted);
        font-size: 0.85rem;
      }
      @media (prefers-reduced-motion: reduce) {
        .bar i {
          transition: none;
        }
      }
    </style>
    <main id="app"></main>

                  { instant: true, label: "Review mistakes", mist: true },
                );
              if (m == "sheet") sheet();
            }),
        );
      }

      let S;
      function start(list, opt) {
        S = {
          list: opt.topic != null ? shuffle(list) : list,
          i: 0,
          ans: [],
          opt,
        };
        if (!S.list.length) {
          home();
          return;
        }
        S.opts = S.list.map((q) =>
          shuffle([
            { t: q.c, ok: true },
            ...q.w.map((t) => ({ t, ok: false })),
          ]),
        );
        show();
      }
      function show() {
        const q = S.list[S.i],
          o = S.opts[S.i],
          a = S.ans[S.i],
          inst = S.opt.instant;
        const done = a != null,
          reveal = inst && done;
        const opts = o
          .map((x, k) => {
            let cls = "";
            if (reveal) {
              if (x.ok) cls = "good";
              else if (a === k) cls = "bad";
            } else if (done && a === k) cls = "picked";
            return `<button class="opt ${cls}" data-k="${k}" ${done ? "disabled" : ""}><span class="k">${L[k]}</span><span>${esc(x.t)}</span></button>`;
          })
          .join("");
        const last = S.i == S.list.length - 1;
        el(`<button class="btn back" id="quit">Exit</button>
  <div class="card">
   <div class="meta"><span>${esc(S.opt.label)}</span><span class="mono">${S.i + 1} / ${S.list.length}</span></div>
   <div class="bar"><i style="width:${((S.i + (done ? 1 : 0)) / S.list.length) * 100}%"></i></div>
   <p class="q">${esc(q.q)}</p>
   <div class="opts">${opts}</div>
   ${reveal ? `<div class="verdict ${o[a].ok ? "good" : "bad"}">${o[a].ok ? "Correct" : "Not quite. Correct answer: " + L[o.findIndex((x) => x.ok)]}</div><div class="explain">${esc(q.e)}</div>` : ""}
   <div class="row"><button class="btn primary" id="next" ${done ? "" : "disabled"}>${last ? "Finish" : "Next"}</button></div>
  </div><p class="note">Keys: 1–4 to answer, Enter for next.</p>`);
        document.getElementById("quit").onclick = home;
        app
          .querySelectorAll(".opt")
          .forEach((b) => (b.onclick = () => pick(+b.dataset.k)));
        document.getElementById("next").onclick = next;
      }
      function pick(k) {
        if (S.ans[S.i] != null) return;
        S.ans[S.i] = k;
        const ok = S.opts[S.i][k].ok,
          id = S.list[S.i].id;
        const w = store.wrong.indexOf(id);
        if (!ok && w < 0) store.wrong.push(id);
        if (ok && w >= 0 && S.opt.mist) store.wrong.splice(w, 1);
        save();
        show();
      }
      function next() {
        if (S.ans[S.i] == null) return;
        if (S.i < S.list.length - 1) {
          S.i++;
          show();
        } else results();
      }
      document.addEventListener("keydown", (e) => {
        if (!S || !document.getElementById("next")) return;
        if (e.key >= "1" && e.key <= "4") {
          const b = app.querySelectorAll(".opt")[+e.key - 1];
          if (b && !b.disabled) b.click();
        }
        if (e.key === "Enter") {
          const n = document.getElementById("next");
          if (n && !n.disabled) n.click();
        }
      });
      function results() {
        const n = S.list.length,
          c = S.ans.filter((a, i) => S.opts[i][a].ok).length,
          pct = Math.round((c / n) * 100);
        if (S.opt.topic != null) {
          store.best[S.opt.topic] = Math.max(store.best[S.opt.topic] || 0, pct);
          save();
        }
        const bad = S.list
          .map((q, i) => ({ q, i }))
          .filter((x) => !S.opts[x.i][S.ans[x.i]].ok);
        const wl = bad
          .map(
            ({ q, i }) =>
              `<div class="item"><p class="q">${esc(q.q)}</p><p class="mine">Your answer: ${esc(S.opts[i][S.ans[i]].t)}</p><p class="ans">Correct: ${esc(q.c)}</p><p class="note">${esc(q.e)}</p></div>`,
          )
          .join("");
        el(`<div class="card"><div class="meta"><span>${esc(S.opt.label)}</span></div>
   <div class="score mono">${c}/${n}</div><p class="sub">${pct}% correct${n == 50 || n == 60 ? ". In a final of this length, " + pct + "% would be about " + Math.round(pct * 0.75) + " of 75 marks." : ""}</p>
   <div class="row"><button class="btn primary" id="again">Back to topics</button>${bad.length ? '<button class="btn" id="retry">Retry the ' + bad.length + " missed</button>" : ""}</div></div>
   ${bad.length ? `<h2>Questions to review</h2><div class="card wrong">${wl}</div>` : ""}`);
        document.getElementById("again").onclick = home;
        const r = document.getElementById("retry");
        if (r)
          r.onclick = () =>
            start(shuffle(bad.map((x) => x.q)), {
              instant: true,
              label: "Retry missed",
            });
      }
      function sheet() {
        el(`<button class="btn back" id="quit">Back</button><header><h1>Answer sheet</h1><p class="sub">Correct options are in green, with the reason underneath.</p></header>
  <input type="search" id="f" placeholder="Search questions, e.g. ALE, k-anonymity, DPIA" aria-label="Search questions">
  <div id="list"></div>`);
        document.getElementById("quit").onclick = home;
        const render = (f) => {
          const q = f.toLowerCase();
          document.getElementById("list").innerHTML =
            DATA.map((t, ti) => {
              const items = all.filter(
                (x) =>
                  x.ti == ti &&
                  (!q ||
                    (x.q + " " + x.c + " " + x.w.join(" ") + " " + x.e)
                      .toLowerCase()
                      .includes(q)),
              );
              if (!items.length) return "";
              return `<details ${q ? "open" : ""} style="margin-bottom:10px"><summary><span>${esc(t.t)}</span><span class="mono note">${items.length}</span></summary><div class="sheet">${items.map((x, i) => `<div class="item"><p><b class="mono">${i + 1}.</b> ${esc(x.q)}</p><ul class="opts-list"><li class="c">✓ ${esc(x.c)}</li>${x.w.map((w) => `<li>○ ${esc(w)}</li>`).join("")}</ul><p class="why">${esc(x.e)}</p></div>`).join("")}</div></details>`;
            }).join("") || '<p class="note">No matches.</p>';
        };
        render("");
        document.getElementById("f").oninput = (e) =>
          render(e.target.value.trim());
      }
      home();
    </script>
  </body>
</html>
